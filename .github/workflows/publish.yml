name: Build and publish site

# Renders the Quarto site and deploys it straight to GitHub Pages.
#
# This requires Settings -> Pages -> Source = "GitHub Actions". In that mode
# GitHub's own "pages build and deployment" job no longer runs on push, so if
# this workflow does not deploy, nothing does - which is exactly what happened
# while this file only rendered and committed docs/.
#
# Nothing is committed back to the repository any more: the rendered site is
# uploaded as an artifact and served from there. That removes the bot commits,
# the [skip ci] guard and the risk of a build loop.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'EDITING.md'
      - 'README.md'
  workflow_dispatch:

# One deployment at a time. A newer push supersedes one already queued, but a
# run that is mid-deploy is allowed to finish rather than leaving Pages
# half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        # Used by the post-render step that strips index.html from links.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up R
        # Only the learning-resources page uses the knitr engine, but the whole
        # project render needs R available for it.
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render site
        run: quarto render

      - name: Check the build is not empty
        # A Quarto failure can still exit 0 in odd cases; refuse to publish a
        # site with no home page rather than replacing a working one.
        run: |
          test -f docs/index.html || { echo "docs/index.html missing - refusing to deploy"; exit 1; }
          echo "pages built: $(find docs -name '*.html' | wc -l)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
