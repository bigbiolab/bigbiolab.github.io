<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <pattern id="chiralGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect width="680" height="440" rx="14" fill="#fcfdfd" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="680" height="440" rx="14" fill="url(#chiralGrid)"/>

  <!-- Mirror Axis -->
  <line x1="330" y1="55" x2="330" y2="360" stroke="#7aa699" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="330" y="42" font-family="ui-monospace, 'Courier New', monospace" font-size="11" font-weight="700" fill="#4d7c6f" text-anchor="middle" letter-spacing="0.18em">MIRROR</text>

  <!-- LEFT SIDE: L . molecular (10^-9 m) -->
  <!-- Edges (Solid Green Lines) -->
  <g stroke="#7aa699" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="95" y1="130" x2="155" y2="75" />
    <line x1="155" y1="75" x2="230" y2="130" />
    <line x1="230" y1="130" x2="280" y2="195" />
    <line x1="280" y1="195" x2="235" y2="260" />
    <line x1="235" y1="260" x2="135" y2="275" />
    <line x1="135" y1="275" x2="165" y2="195" />
    <line x1="95" y1="130" x2="165" y2="195" />
    <line x1="165" y1="195" x2="230" y2="130" />
    <line x1="165" y1="195" x2="235" y2="260" />
  </g>

  <!-- Left Nodes (Solid Green) -->
  <circle cx="95" cy="130" r="5" fill="#005a40"/>
  <circle cx="155" cy="75" r="5" fill="#005a40"/>
  <circle cx="280" cy="195" r="5" fill="#005a40"/>
  <circle cx="235" cy="260" r="5" fill="#005a40"/>
  <circle cx="135" cy="275" r="5" fill="#005a40"/>
  <circle cx="165" cy="195" r="5.5" fill="#005a40"/>

  <!-- Left Focal Node (Red with Halo) -->
  <circle cx="230" cy="130" r="14" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.6"/>
  <circle cx="230" cy="130" r="8" fill="#f43f5e"/>

  <!-- Left Labels -->
  <text x="95" y="340" font-family="ui-monospace, 'Courier New', monospace" font-size="13" font-weight="600" fill="#334155" letter-spacing="0.06em">L · molecular</text>
  <text x="95" y="362" font-family="ui-monospace, 'Courier New', monospace" font-size="12" font-weight="700" fill="#006a4e" letter-spacing="0.04em">10⁻⁹ m</text>

  <!-- RIGHT SIDE: D . population (10^5 m) -->
  <!-- Mirrored across x = 330:  x' = 2*330 - x = 660 - x -->
  <!-- 95 -> 565, 155 -> 505, 230 -> 430, 280 -> 380, 235 -> 425, 135 -> 525, 165 -> 495 -->
  <!-- Edges (Dashed Green Lines) -->
  <g stroke="#7aa699" stroke-width="1.8" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="565" y1="130" x2="505" y2="75" />
    <line x1="505" y1="75" x2="430" y2="130" />
    <line x1="430" y1="130" x2="380" y2="195" />
    <line x1="380" y1="195" x2="425" y2="260" />
    <line x1="425" y1="260" x2="525" y2="275" />
    <line x1="525" y1="275" x2="495" y2="195" />
    <line x1="565" y1="130" x2="495" y2="195" />
    <line x1="495" y1="195" x2="430" y2="130" />
    <line x1="495" y1="195" x2="425" y2="260" />
  </g>

  <!-- Right Nodes (Concentric Rings with Inner Dot) -->
  <!-- Node (565, 130) -->
  <circle cx="565" cy="130" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="565" cy="130" r="3" fill="#005a40"/>

  <!-- Node (505, 75) -->
  <circle cx="505" cy="75" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="505" cy="75" r="3" fill="#005a40"/>

  <!-- Node (380, 195) -->
  <circle cx="380" cy="195" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="380" cy="195" r="3" fill="#005a40"/>

  <!-- Node (425, 260) -->
  <circle cx="425" cy="260" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="425" cy="260" r="3" fill="#005a40"/>

  <!-- Node (525, 275) -->
  <circle cx="525" cy="275" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="525" cy="275" r="3" fill="#005a40"/>

  <!-- Node (495, 195) -->
  <circle cx="495" cy="195" r="9" fill="none" stroke="#2d6a4f" stroke-width="1.2"/>
  <circle cx="495" cy="195" r="3.5" fill="#005a40"/>

  <!-- Right Mirrored Focal Node (Red Concentric Rings) -->
  <circle cx="430" cy="130" r="14" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.6"/>
  <circle cx="430" cy="130" r="8" fill="none" stroke="#f43f5e" stroke-width="1.4"/>
  <circle cx="430" cy="130" r="3.5" fill="#f43f5e"/>

  <!-- Right Labels -->
  <text x="440" y="340" font-family="ui-monospace, 'Courier New', monospace" font-size="13" font-weight="600" fill="#334155" letter-spacing="0.06em">D · population</text>
  <text x="440" y="362" font-family="ui-monospace, 'Courier New', monospace" font-size="12" font-weight="700" fill="#006a4e" letter-spacing="0.04em">10⁵ m</text>
</svg>
