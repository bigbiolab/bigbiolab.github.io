<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006a4e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f52b43"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#006a4e" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background card with subtle science pattern -->
  <rect width="520" height="380" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Subtle circular radar grid -->
  <circle cx="260" cy="190" r="140" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="260" cy="190" r="95" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="260" cy="190" r="50" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 4"/>

  <!-- Neural Network Connections -->
  <g stroke="#94a3b8" stroke-width="1.2" opacity="0.6">
    <line x1="80" y1="90" x2="170" y2="130" />
    <line x1="80" y1="90" x2="120" y2="210" />
    <line x1="170" y1="130" x2="260" y2="100" />
    <line x1="170" y1="130" x2="240" y2="190" />
    <line x1="120" y1="210" x2="240" y2="190" />
    <line x1="120" y1="210" x2="150" y2="300" />
    <line x1="240" y1="190" x2="340" y2="160" />
    <line x1="240" y1="190" x2="280" y2="280" />
    <line x1="260" y1="100" x2="370" y2="110" />
    <line x1="340" y1="160" x2="370" y2="110" />
    <line x1="340" y1="160" x2="440" y2="180" />
    <line x1="280" y1="280" x2="390" y2="280" />
    <line x1="390" y1="280" x2="440" y2="180" />
    <line x1="150" y1="300" x2="280" y2="280" />
  </g>

  <!-- Network Nodes -->
  <circle cx="80" cy="90" r="4.5" fill="#006a4e" />
  <circle cx="170" cy="130" r="5.5" fill="#0d9488" />
  <circle cx="120" cy="210" r="5" fill="#006a4e" />
  <circle cx="260" cy="100" r="6" fill="#006a4e" />
  <circle cx="240" cy="190" r="8" fill="#006a4e" />
  <circle cx="150" cy="300" r="4.5" fill="#0d9488" />
  <circle cx="340" cy="160" r="7" fill="#006a4e" />
  <circle cx="280" cy="280" r="5.5" fill="#0d9488" />
  <circle cx="370" cy="110" r="5" fill="#006a4e" />
  <circle cx="390" cy="280" r="5.5" fill="#0d9488" />
  <circle cx="440" cy="180" r="5.5" fill="#006a4e" />

  <!-- Focal Chiral Red Accent Nodes -->
  <circle cx="260" cy="100" r="14" fill="#f52b43" opacity="0.15"/>
  <circle cx="260" cy="100" r="4" fill="#f52b43"/>
  <circle cx="340" cy="160" r="15" fill="#f52b43" opacity="0.15"/>
  <circle cx="340" cy="160" r="4.5" fill="#f52b43"/>

  <!-- DNA Strands & Helical Curves -->
  <path d="M 130,70 Q 195,150 260,190 T 390,310" fill="none" stroke="url(#dnaGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 390,70 Q 325,150 260,190 T 130,310" fill="none" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="4 5"/>

  <!-- Base-Pair Connectors -->
  <line x1="150" y1="95" x2="370" y2="95" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="175" y1="125" x2="345" y2="125" stroke="#006a4e" stroke-width="2" opacity="0.7"/>
  <line x1="205" y1="155" x2="315" y2="155" stroke="#f52b43" stroke-width="2" opacity="0.8"/>
  <line x1="205" y1="225" x2="315" y2="225" stroke="#006a4e" stroke-width="2" opacity="0.7"/>
  <line x1="175" y1="255" x2="345" y2="255" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 3"/>
  <line x1="150" y1="285" x2="370" y2="285" stroke="#0d9488" stroke-width="2" opacity="0.8"/>

  <!-- Floating Badges in Modern Academic Style -->
  <g transform="translate(25, 30)" filter="url(#softShadow)">
    <rect width="135" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#006a4e"/>
    <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Multi-Omics Data</text>
  </g>

  <g transform="translate(365, 30)" filter="url(#softShadow)">
    <rect width="130" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#f52b43"/>
    <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Bio-AI Diagnostics</text>
  </g>

  <g transform="translate(340, 320)" filter="url(#softShadow)">
    <rect width="155" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#0d9488"/>
    <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Spatial Epidemiology</text>
  </g>

  <g transform="translate(25, 320)" filter="url(#softShadow)">
    <rect width="145" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#006a4e"/>
    <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Open-Access Science</text>
  </g>
</svg>