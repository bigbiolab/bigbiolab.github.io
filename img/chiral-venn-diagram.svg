<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="100%" height="100%">
  <defs>
    <!-- Background subtle grid -->
    <pattern id="vennGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8"/>
    </pattern>

    <!-- Soft drop shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="centerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Linear Gradients for 4 Lobes -->
    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006a4e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#006a4e" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="geoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="840" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <rect width="840" height="560" rx="14" fill="url(#vennGrid)"/>

  <!-- Top Banner Scale Bar: L. Molecular (10^-9 m) <---> D. Population (10^5 m) -->
  <g transform="translate(60, 32)">
    <text x="0" y="16" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#006a4e" letter-spacing="0.05em">L · MOLECULAR [10⁻⁹ m]</text>
    <line x1="205" y1="12" x2="515" y2="12" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="360" cy="12" r="3" fill="#94a3b8"/>
    <text x="360" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="0.1em">CHIRAL MIRROR AXIS</text>
    <text x="720" y="16" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#059669" text-anchor="end" letter-spacing="0.05em">D · POPULATION [10⁵ m]</text>
  </g>

  <!-- Venn Lobes (4 Ellipses intersecting in center) -->
  <!-- Center intersection point is at (420, 275) -->
  
  <!-- Lobe 1: Bioinformatics (Top Left) -->
  <g transform="translate(340, 220) rotate(-35)">
    <ellipse cx="0" cy="0" rx="155" ry="98" fill="url(#bioGrad)" stroke="#006a4e" stroke-width="1.8"/>
  </g>

  <!-- Lobe 2: Bio-AI (Top Right) -->
  <g transform="translate(500, 220) rotate(35)">
    <ellipse cx="0" cy="0" rx="155" ry="98" fill="url(#aiGrad)" stroke="#0284c7" stroke-width="1.8"/>
  </g>

  <!-- Lobe 3: Public Health (Bottom Left) -->
  <g transform="translate(340, 330) rotate(35)">
    <ellipse cx="0" cy="0" rx="155" ry="98" fill="url(#healthGrad)" stroke="#4f46e5" stroke-width="1.8"/>
  </g>

  <!-- Lobe 4: Geospatial Health (Bottom Right) -->
  <g transform="translate(500, 330) rotate(-35)">
    <ellipse cx="0" cy="0" rx="155" ry="98" fill="url(#geoGrad)" stroke="#059669" stroke-width="1.8"/>
  </g>

  <!-- Central Intersection Highlight: CHIRAL Core -->
  <ellipse cx="420" cy="275" rx="38" ry="32" fill="#ffffff" stroke="#f52b43" stroke-width="2" filter="url(#centerGlow)"/>
  <ellipse cx="420" cy="275" rx="34" ry="28" fill="#ffebee" opacity="0.8"/>
  <circle cx="420" cy="275" r="5" fill="#f52b43"/>
  <text x="420" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="middle">CHIRAL</text>
  <text x="420" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#f52b43" text-anchor="middle">PRECISION</text>
  <text x="420" y="294" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#475569" text-anchor="middle">HEALTH</text>

  <!-- 2-Way Intersection Labels (The Bridges) -->
  <!-- Top: Bioinformatics & Bio-AI -->
  <rect x="360" y="148" width="120" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" opacity="0.95"/>
  <text x="420" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#0f766e" text-anchor="middle">Biomarker Discovery</text>

  <!-- Bottom: Public Health & Geospatial -->
  <rect x="360" y="380" width="120" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" opacity="0.95"/>
  <text x="420" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">Spatial Epidemiology</text>

  <!-- Left: Bioinformatics & Public Health -->
  <rect x="220" y="264" width="105" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" opacity="0.95"/>
  <text x="272" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1e293b" text-anchor="middle">Clinical Registries</text>

  <!-- Right: Bio-AI & Geospatial -->
  <rect x="515" y="264" width="105" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" opacity="0.95"/>
  <text x="567" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1e293b" text-anchor="middle">Predictive Spatial AI</text>

  <!-- Four External Group Labels (Card Style) -->

  <!-- Top-Left Group: Bioinformatics & Computational Biology -->
  <g transform="translate(45, 95)">
    <rect width="215" height="78" rx="8" fill="#ffffff" stroke="#006a4e" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#006a4e"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#006a4e">BIOINFORMATICS</text>
    <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">&amp; Computational Biology</text>
    <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Multi-Omics Integration (RNA-Seq)</text>
    <text x="14" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Cancer Genomics &amp; scRNA-Seq</text>
    <line x1="215" y1="39" x2="265" y2="160" stroke="#006a4e" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="265" cy="160" r="3" fill="#006a4e"/>
  </g>

  <!-- Top-Right Group: Bio-AI & Computational Intelligence -->
  <g transform="translate(580, 95)">
    <rect width="215" height="78" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="211" y="0" width="4" height="78" rx="2" fill="#0284c7"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0284c7">BIO-AI</text>
    <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">&amp; Health Data Science</text>
    <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Deep Learning &amp; Neural Nets</text>
    <text x="14" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Clinical Risk Prediction &amp; Vision</text>
    <line x1="0" y1="39" x2="-55" y2="160" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="-55" cy="160" r="3" fill="#0284c7"/>
  </g>

  <!-- Bottom-Left Group: Public Health & Informatics -->
  <g transform="translate(45, 395)">
    <rect width="215" height="78" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#4f46e5"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#4f46e5">PUBLIC HEALTH</text>
    <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">&amp; Health Informatics</text>
    <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Epidemiological Surveillance</text>
    <text x="14" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• National Health Survey Analytics</text>
    <line x1="215" y1="39" x2="265" y2="-10" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="265" cy="-10" r="3" fill="#4f46e5"/>
  </g>

  <!-- Bottom-Right Group: Geospatial Health Research -->
  <g transform="translate(580, 395)">
    <rect width="215" height="78" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="211" y="0" width="4" height="78" rx="2" fill="#059669"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#059669">GEOSPATIAL HEALTH</text>
    <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b">&amp; Environmental Analytics</text>
    <text x="14" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• GIS Disease Outbreak Mapping</text>
    <text x="14" y="67" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#475569">• Satellite Earth Observation</text>
    <line x1="0" y1="39" x2="-55" y2="-10" stroke="#059669" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="-55" cy="-10" r="3" fill="#059669"/>
  </g>

  <!-- Bottom Footer Note -->
  <text x="420" y="525" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
    Multidisciplinary Integration: Bridging Biological Complexity with Population-Level Impact
  </text>
</svg>
