# Peer-reviewed journal articles, newest first. The listings sort on `date`, so
# a new entry can go anywhere in the file - the top is just easier to scan.
#
# Fields:
#   title       the paper's title
#   author      author list in APA style: surname, then initials, with "&"
#               before the last author -
#                 Ahmed, M. Z., Billah, M. M., & Hossain, M. J.
#               Keep the published order - student authors keep the position
#               they earned, and we do not reorder by seniority. Where a
#               surname is more than one word ("Al Mamun"), keep it whole.
#   year        publication year, in quotes
#   date        publication date, YYYY-MM-DD. This is what orders the list and
#               decides which paper the home page features, so a year alone is
#               not enough when several papers share one.
#   journal     journal or venue name
#   doi         full https:// link, or "" if none yet
#   preprint    full https:// link, or ""
#   materials   code/data link, or ""
#   categories  one or more tags shown as pills, and used by the page filter
#
# Titles, journals, years and author names were taken from each paper's
# registered Crossref record (https://api.crossref.org/works/<doi>) rather than
# retyped, so they match what the publisher has on file.

